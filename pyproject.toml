[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aws-compliance-mcp"
version = "0.1.0"
description = "MCP server for real-time AWS compliance scanning (PCI-DSS, CIS, Well-Architected)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya Manikyala" }]

dependencies = [
    "mcp>=1.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[config,securityhub,s3,iam,ec2,cloudtrail,guardduty]>=5.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
aws-compliance-mcp = "aws_compliance_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
